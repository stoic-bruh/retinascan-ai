<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RetinaScan AI — DR Screening</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; background: #f7f9fb; color: #1a1a1a; }
  h1 { font-size: 1.6rem; }
  .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-top: 20px; }
  input[type=file] { margin: 12px 0; }
  button { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
  button:disabled { background: #94a3b8; }
  .images { display: flex; gap: 16px; margin-top: 16px; }
  .images img { width: 260px; border-radius: 8px; }
  .result { margin-top: 16px; }
  .label { font-size: 1.3rem; font-weight: 600; }
  .conf { color: #475569; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 0.85rem; }
  .bar-bg { flex: 1; background: #e2e8f0; border-radius: 4px; height: 10px; overflow: hidden; }
  .bar-fill { background: #2563eb; height: 100%; }
  .note { background: #fef3c7; padding: 12px; border-radius: 8px; margin-top: 12px; }
</style>
</head>
<body>
  <h1>RetinaScan AI</h1>
  <p>Explainable AI screening for Diabetic Retinopathy — upload a fundus image to get a severity grade and a heatmap showing why.</p>

  <div class="card">
    <input type="file" id="fileInput" accept="image/*">
    <br>
    <button id="scanBtn" onclick="runScan()">Scan Image</button>

    <div id="result" class="result" style="display:none;">
      <div class="images">
        <div><p>Uploaded (processed)</p><img id="origImg"></div>
        <div><p>Grad-CAM heatmap</p><img id="heatmapImg"></div>
      </div>
      <div class="label" id="labelText"></div>
      <div class="conf" id="confText"></div>
      <div id="probBars"></div>
      <div class="note" id="explanationText"></div>
    </div>
  </div>

<script>
// Change this if your backend runs elsewhere
const API_URL = "http://localhost:8000";

async function runScan() {
  const fileInput = document.getElementById("fileInput");
  const btn = document.getElementById("scanBtn");
  if (!fileInput.files.length) {
    alert("Choose an image first.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Scanning...";

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);

  try {
    const res = await fetch(`${API_URL}/predict`, { method: "POST", body: formData });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    renderResult(data);
  } catch (err) {
    alert("Prediction failed: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Scan Image";
  }
}

function renderResult(data) {
  document.getElementById("result").style.display = "block";
  document.getElementById("origImg").src = "data:image/png;base64," + data.processed_image_b64;
  document.getElementById("heatmapImg").src = "data:image/png;base64," + data.heatmap_overlay_b64;
  document.getElementById("labelText").textContent = data.predicted_label;
  document.getElementById("confText").textContent = `Confidence: ${(data.confidence * 100).toFixed(1)}%`;
  document.getElementById("explanationText").textContent = data.explanation;

  const barsDiv = document.getElementById("probBars");
  barsDiv.innerHTML = "";
  for (const [label, prob] of Object.entries(data.class_probabilities)) {
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `
      <span style="width:120px;">${label}</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${prob * 100}%;"></div></div>
      <span>${(prob * 100).toFixed(1)}%</span>
    `;
    barsDiv.appendChild(row);
  }
}
</script>
</body>
</html>
